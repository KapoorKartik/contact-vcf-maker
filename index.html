<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111814" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Turn spreadsheet rows into ready-to-import VCF contact files, one per assignee.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Contact VCF Maker</title>
  <style>
    :root {
      color-scheme: light;
      --bg-a: #f7f8f4;
      --bg-b: #eef3ed;
      --panel: rgba(255,255,255,.94);
      --line: #e1e8e1;
      --ink: #1e332c;
      --muted: #77857d;
      --faint: #93a097;
      --label: #4e6759;
      --check-ink: #355b48;
      --green: #276b55;
      --green-dark: #1e5744;
      --on-green: #ffffff;
      --field: #dce5dc;
      --field-hover: #c4d6c8;
      --input-bg: #ffffff;
      --well: #fbfcfa;
      --soft: #edf4ee;
      --soft-ink: #28674f;
      --divider: #edf1ec;
      --row-seq: #9aa69d;
      --phone: #6f7f75;
      --warn: #9a5b2b;
      --warn-bg: #fbf3ea;
      --warn-line: #e3cdb6;
      --heart: #c2524a;
      --focus: rgba(39,107,85,.25);
      --scroll-thumb: #b8c9bb;
      --scroll-track: #f1f4f0;
      --shadow: 0 8px 28px rgba(31, 57, 43, .055);
      --btn-shadow: 0 4px 10px rgba(39,107,85,.15);
      /* Per-assignee accent: lightness/saturation pairs, hue comes from --hue on each group */
      --tint-bg: 46% 92%;
      --tint-ink: 45% 30%;
      --tint-stripe: 40% 52%;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg-a: #111814;
        --bg-b: #0c1210;
        --panel: rgba(24,32,28,.96);
        --line: #26312b;
        --ink: #e3ebe6;
        --muted: #9aa89f;
        --faint: #76857b;
        --label: #a9bdb1;
        --check-ink: #c4d6cb;
        --green: #3c9878;
        --green-dark: #348568;
        --on-green: #f4fbf7;
        --field: #2e3a34;
        --field-hover: #41514a;
        --input-bg: #141b17;
        --well: #151c18;
        --soft: #1d2a24;
        --soft-ink: #8fd0b3;
        --divider: #222c27;
        --row-seq: #6a786f;
        --phone: #a3b2a8;
        --warn: #e3a873;
        --warn-bg: #2a2119;
        --warn-line: #4d3a28;
        --heart: #e57a72;
        --focus: rgba(92,180,146,.35);
        --scroll-thumb: #3a4a42;
        --scroll-track: #18201c;
        --shadow: 0 8px 28px rgba(0,0,0,.35);
        --btn-shadow: 0 4px 14px rgba(0,0,0,.35);
        --tint-bg: 28% 22%;
        --tint-ink: 55% 76%;
        --tint-stripe: 45% 50%;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, var(--bg-a) 0%, var(--bg-b) 100%) fixed;
      background-color: var(--bg-b);
      color: var(--ink);
      font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page { width: min(1320px, calc(100% - 40px)); margin: 0 auto; padding: 24px 0 30px; }

    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-icon {
      width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
      background: var(--green); color: var(--on-green); box-shadow: var(--btn-shadow);
    }
    .brand-icon svg { width: 21px; height: 21px; }
    .brand-name { font-weight: 750; font-size: 15px; letter-spacing: -.2px; }
    .brand-sub { color: var(--faint); font-size: 12px; margin-top: 2px; }
    .credit { color: var(--muted); font-size: 13px; text-align: right; }
    .credit strong { color: var(--ink); font-weight: 650; }
    .credit .heart { color: var(--heart); display: inline-block; animation: beat 2.4s ease-in-out infinite; }

    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
      padding: 22px; box-shadow: var(--shadow); min-width: 0;
    }
    .panel-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    h2 { margin: 0; font-size: 15px; font-weight: 750; letter-spacing: -.15px; }
    .section-gap { margin-top: 20px; }

    textarea, input { font: inherit; color: var(--ink); }
    .paste-wrap { position: relative; }
    textarea {
      display: block; width: 100%; min-height: 220px; resize: vertical; outline: none;
      border: 1px solid var(--field); border-radius: 12px; background: var(--well);
      padding: 14px 15px; font: 13px/1.75 var(--mono); tab-size: 18; white-space: pre; overflow-x: auto;
      scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent;
      transition: border-color .18s, box-shadow .18s;
    }
    textarea::placeholder, .text-input::placeholder { color: var(--faint); opacity: .8; }
    textarea:focus, .text-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--focus); }
    .paste-meta { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .clear-btn {
      cursor: pointer; font: inherit; font-size: 11px; font-weight: 650;
      border: 1px solid var(--field); border-radius: 7px; background: var(--input-bg); color: var(--label); padding: 5px 9px;
      transition: background .15s, border-color .15s;
    }
    .clear-btn:hover { background: var(--soft); border-color: var(--field-hover); }
    .columns { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; color: var(--muted); font-size: 12px; }
    .col-chip { background: var(--soft); color: var(--soft-ink); border-radius: 6px; padding: 3px 8px; font-weight: 650; font-size: 11px; }
    .col-sep { color: var(--faint); }

    .fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 96px; gap: 12px; }
    .field { min-width: 0; }
    label.field-label { display: block; color: var(--label); font-size: 12px; font-weight: 700; margin-bottom: 7px; }
    .text-input {
      width: 100%; height: 43px; outline: none; font-size: 13px;
      border: 1px solid var(--field); border-radius: 9px; background: var(--input-bg); padding: 0 12px;
      transition: border-color .18s, box-shadow .18s;
    }
    .optional { color: var(--faint); font-weight: 500; margin-left: 4px; }
    .name-example { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 14px; padding: 9px 12px; border-radius: 9px; background: var(--soft); color: var(--muted); font-size: 12px; }
    .name-example strong { color: var(--ink); font-weight: 700; margin-left: 4px; overflow-wrap: anywhere; }
    .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    .check-row { display: flex; align-items: flex-start; gap: 10px; margin-top: 14px; color: var(--check-ink); font-size: 12px; font-weight: 650; line-height: 1.4; cursor: pointer; }
    .check-row input { accent-color: var(--green); width: 17px; height: 17px; margin: 1px 0 0; flex: 0 0 auto; }
    .check-row small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; line-height: 1.45; margin-top: 3px; }

    .count-pill { color: var(--soft-ink); background: var(--soft); padding: 6px 10px; border-radius: 99px; font-size: 11px; font-weight: 750; white-space: nowrap; }
    .notices { display: grid; gap: 6px; margin-bottom: 12px; }
    .notices:empty { display: none; }
    .notice { display: flex; gap: 8px; align-items: flex-start; background: var(--warn-bg); color: var(--warn); border-radius: 9px; padding: 8px 11px; font-size: 12px; line-height: 1.45; }
    .notice svg { width: 15px; height: 15px; flex: 0 0 auto; margin-top: 1px; }

    .groups {
      display: flex; flex-direction: column; gap: 8px; max-height: 520px; min-height: 140px; overflow-y: auto; overscroll-behavior: contain;
      padding: 2px 7px 2px 0; scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) var(--scroll-track);
    }
    .groups::-webkit-scrollbar { width: 7px; }
    .groups::-webkit-scrollbar-track { background: var(--scroll-track); border-radius: 10px; }
    .groups::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; }
    .group {
      --hue: 155; flex: 0 0 auto;
      border: 1px solid var(--line); border-left: 3px solid hsl(var(--hue) var(--tint-stripe));
      border-radius: 13px; background: var(--well); overflow: hidden;
    }
    .group.unassigned { border: 1px dashed var(--warn-line); border-left: 3px solid var(--warn-line); background: var(--warn-bg); }
    .group-tools { display: flex; gap: 8px; margin-bottom: 10px; }
    .group-tools[hidden], .search-input[hidden] { display: none; }
    .search-input { flex: 1; height: 36px; }
    .tool-btn {
      margin-left: auto; flex: 0 0 auto; height: 36px; padding: 0 12px; cursor: pointer;
      border: 1px solid var(--field); border-radius: 9px; background: var(--input-bg); color: var(--label);
      font: inherit; font-size: 12px; font-weight: 700;
    }
    .tool-btn:hover { background: var(--soft); border-color: var(--field-hover); }
    .group-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 4px; background: var(--input-bg); }
    .group.open .group-head { border-bottom: 1px solid var(--divider); }
    .group:not(.open) .group-body { display: none; }
    .group-toggle {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 4px 6px; cursor: pointer;
      border: 0; border-radius: 8px; background: transparent; color: inherit; font: inherit; text-align: left;
    }
    .group-toggle:hover { background: var(--soft); }
    .chev { width: 14px; height: 14px; flex: 0 0 auto; color: var(--faint); transition: transform .16s; }
    .group.open .chev { transform: rotate(90deg); }
    .group-count { margin-left: 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
    .group-body .group-file { padding: 7px 12px; border-bottom: 1px solid var(--divider); margin: 0; }
    .group.unassigned .group-head { background: transparent; border-bottom-color: var(--warn-line); }
    .group-avatar {
      width: 30px; height: 30px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 10px;
      background: hsl(var(--hue) var(--tint-bg)); color: hsl(var(--hue) var(--tint-ink)); font-size: 11px; font-weight: 800;
    }
    .group.unassigned .group-avatar { background: var(--warn-line); color: var(--warn); }
    .group-info { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .group-name { font-size: 13px; font-weight: 750; }
    .group-file { color: var(--faint); font: 11px/1.4 var(--mono); margin-top: 2px; overflow-wrap: anywhere; }
    .group-btn {
      flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; min-height: 36px; cursor: pointer;
      border: 1px solid var(--field); border-radius: 9px; background: var(--input-bg); color: var(--green);
      font: inherit; font-size: 12px; font-weight: 700; padding: 7px 11px;
      transition: background .15s, border-color .15s, color .15s;
    }
    .group-btn:hover { background: var(--soft); border-color: var(--field-hover); }
    .group-btn svg { width: 15px; height: 15px; }
    .group-btn.saved { background: var(--green); border-color: var(--green); color: var(--on-green); }
    .contacts { display: grid; gap: 1px; background: var(--divider); }
    .contact { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 8px 12px; background: var(--well); }
    .group.unassigned .contact { background: var(--warn-bg); }
    .contact-seq { width: 22px; flex: 0 0 auto; color: var(--row-seq); font: 11px var(--mono); }
    .contact-main { min-width: 0; flex: 1; display: flex; justify-content: space-between; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; }
    .contact-name { font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
    .contact-name .na { color: var(--warn); font-weight: 750; }
    .contact-phone { color: var(--phone); font: 12px var(--mono); white-space: nowrap; }
    .empty { padding: 26px 14px; border: 1px dashed var(--field); border-radius: 13px; background: var(--well); color: var(--muted); font-size: 12px; line-height: 1.6; text-align: center; }

    .download-bar { margin-top: 16px; }
    .download {
      width: 100%; min-height: 49px; display: flex; justify-content: center; align-items: center; gap: 9px;
      border: 0; border-radius: 11px; background: var(--green); color: var(--on-green); padding: 13px 16px; cursor: pointer;
      font: inherit; font-size: 14px; font-weight: 750; box-shadow: var(--btn-shadow);
      transition: background .16s, transform .16s, box-shadow .16s, opacity .16s;
    }
    .download:hover:not(:disabled) { background: var(--green-dark); transform: translateY(-1px); }
    .download:disabled { opacity: .42; cursor: not-allowed; box-shadow: none; }
    .download svg { width: 18px; height: 18px; }
    .download:focus-visible, .clear-btn:focus-visible, .group-btn:focus-visible, .group-toggle:focus-visible, .tool-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .message { color: var(--soft-ink); font-size: 12px; line-height: 1.5; margin-top: 10px; text-align: center; }
    .message:empty { display: none; }

    @keyframes beat { 0%, 70%, 100% { transform: scale(1); } 80% { transform: scale(1.18); } }

    @media (min-width: 901px) and (min-height: 600px) {
      .page { height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: 18px 0; }
      header { flex: 0 0 auto; margin-bottom: 14px; }
      .workspace { flex: 1; min-height: 0; align-items: stretch; }
      .panel { display: flex; flex-direction: column; min-height: 0; }
      .panel:first-child { overflow-y: auto; }
      .paste-wrap { flex: 1; min-height: 150px; display: flex; flex-direction: column; }
      textarea { flex: 1; min-height: 0; resize: none; }
      .groups { flex: 1; min-height: 0; max-height: none; }
    }
    @media (max-width: 900px) {
      .page { width: min(calc(100% - 28px), 700px); padding-top: 18px; }
      .workspace { grid-template-columns: 1fr; gap: 14px; }
      header { margin-bottom: 18px; }
      .panel { padding: 18px; }
      .groups { max-height: none; overflow: visible; padding-right: 0; }
      /* Keep the main action within thumb reach while scrolling the preview */
      .download-bar {
        position: sticky; bottom: 0; z-index: 2; margin: 16px -18px -18px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
        background: var(--panel); border-top: 1px solid var(--line); border-radius: 0 0 18px 18px;
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      }
      .message { margin-top: 8px; }
    }
    @media (max-width: 520px) {
      .page { width: calc(100% - 20px); padding-top: 14px; }
      header { flex-wrap: wrap; gap: 8px; }
      .credit { flex-basis: 100%; text-align: left; font-size: 12px; padding-left: 47px; }
      .panel { padding: 15px 13px; border-radius: 14px; }
      .download-bar { margin: 14px -13px -15px; padding: 10px 13px calc(10px + env(safe-area-inset-bottom)); border-radius: 0 0 14px 14px; }
      .brand-icon { width: 36px; height: 36px; border-radius: 10px; }
      .brand-name { font-size: 14px; }
      .fields { grid-template-columns: minmax(0, 1fr) 92px; gap: 9px; }
      .file-field { grid-column: 1 / -1; order: 3; }
      .checks { grid-template-columns: 1fr; }
      .text-input { height: 44px; padding: 0 10px; font-size: 16px; }
      textarea { min-height: 190px; padding: 12px; font-size: 12px; tab-size: 10; }
      .col-tip { display: none; }
      .group-btn { min-width: 44px; min-height: 40px; }
      .group-btn .btn-label { display: none; }
      .group-btn.saved .btn-label { display: inline; }
      .check-row input { width: 19px; height: 19px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3.5h6v3H9zM8.5 11h7M8.5 15h7"/></svg>
        </div>
        <div>
          <div class="brand-name">Contact VCF Maker</div>
          <div class="brand-sub">One contact file per assignee</div>
        </div>
      </div>
      <div class="credit">Made with <span class="heart" aria-label="love">♥</span> by <strong>Karunābdhi Srigovind Das</strong></div>
    </header>

    <section class="workspace" aria-label="Contact VCF generator">
      <div class="panel">
        <div class="panel-heading"><h2>Contacts</h2></div>
        <div class="paste-wrap">
          <textarea id="contactInput" spellcheck="false" wrap="off" aria-label="Paste name, number and assignee columns"
            placeholder="Paste from your sheet, e.g.&#10;Jane Doe	98765 43210	Ram Das&#10;John Smith	91234 56789	Shyam Das&#10;	99887 76655	Ram Das"></textarea>
        </div>
        <div class="columns">
          <span class="col-chip">Name</span><span class="col-sep">→</span>
          <span class="col-chip">Number</span><span class="col-sep">→</span>
          <span class="col-chip">Assignee</span>
          <span class="col-tip">· copy 3 columns straight from the sheet</span>
          <span class="paste-meta"><span id="rowCount">0 rows</span><button class="clear-btn" type="button" id="clearBtn">Clear list</button></span>
        </div>

        <div class="panel-heading section-gap"><h2>Naming</h2></div>
        <div class="fields">
          <div class="field">
            <label class="field-label" for="groupLabel">Name prefix <span class="optional">optional</span></label>
            <input class="text-input" id="groupLabel" type="text" placeholder="e.g. Batch 1">
          </div>
          <div class="field file-field">
            <label class="field-label" for="filename">File name <span class="optional">optional</span></label>
            <input class="text-input" id="filename" type="text" placeholder="Uses the prefix">
          </div>
          <div class="field">
            <label class="field-label" for="startAt">Start at</label>
            <input class="text-input" id="startAt" type="number" min="1" step="1" value="1">
          </div>
        </div>

        <div class="checks">
          <label class="check-row">
            <input id="addSequence" type="checkbox" checked>
            <span>Add sequence number<small>01, 02… restarting for each assignee.</small></span>
          </label>
          <label class="check-row">
            <input id="keepOriginal" type="checkbox" checked>
            <span>Keep original name<small>Missing names become “NA”.</small></span>
          </label>
        </div>
        <div class="name-example">
          <span>Contact <strong id="nameExample">01 Jane Doe</strong></span>
          <span>File <strong><span id="filePattern">Contacts</span> - [assignee].vcf</strong></span>
        </div>
      </div>

      <div class="panel">
        <div class="panel-heading">
          <h2>Preview</h2>
          <span class="count-pill" id="contactCount">0 contacts</span>
        </div>
        <div class="notices" id="notices" aria-live="polite"></div>
        <div class="group-tools" id="groupTools" hidden>
          <input class="text-input search-input" id="groupSearch" type="search" placeholder="Find assignee…" aria-label="Find assignee" hidden>
          <button class="tool-btn" id="toggleAllBtn" type="button">Expand all</button>
        </div>
        <div class="groups" id="groupPreview"></div>
        <div class="download-bar">
        <button class="download" id="downloadAllBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>
          <span id="downloadText">Download all</span>
        </button>
        <div class="message" id="message" role="status"></div>
        </div>
      </div>
    </section>

  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const input = $("contactInput");
    const groupLabel = $("groupLabel");
    const startAt = $("startAt");
    const filename = $("filename");
    const addSequence = $("addSequence");
    const keepOriginal = $("keepOriginal");
    const preview = $("groupPreview");
    const notices = $("notices");
    const message = $("message");
    const groupSearch = $("groupSearch");
    const toggleAllBtn = $("toggleAllBtn");

    const NAME_PLACEHOLDER = "NA";
    const UNASSIGNED = "Unassigned";
    const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
    const clean = (value) => (value || "").trim().replace(/^["']|["']$/g, "").trim();

    function splitLine(line) {
      // Spreadsheet paste is tab-separated. Also support semicolon and comma separated rows.
      // Don't trim the line first: a leading tab means the name cell is empty.
      if (line.includes("\t")) return line.split("\t");
      if (line.includes(";")) return line.split(";");
      if (line.includes(",")) return line.split(",");
      // Bare "Name 98765 43210" rows (no assignee): treat the trailing phone-like run as the number.
      const match = line.trim().match(/^(.*?)\s*((?:\+|00)?[\d(][\d\s().-]*\d)\s*$/);
      return match ? [match[1], match[2]] : [line];
    }

    function parseRows(raw) {
      const lines = raw.split(/\r?\n/).filter(line => line.trim());
      const rows = [];
      let skipped = 0;
      for (const line of lines) {
        const cells = splitLine(line).map(clean);
        const [name = "", phone = "", assignee = ""] = cells;
        // Rows without any digits in the number column (e.g. a header row) are skipped.
        if (!/\d/.test(phone)) { skipped++; continue; }
        rows.push({ name, phone, assignee: assignee.replace(/\s+/g, " ") });
      }
      return { rows, skipped, lineCount: lines.length };
    }

    function groupByAssignee(rows) {
      const groups = new Map();
      for (const row of rows) {
        const key = row.assignee.toLowerCase();
        if (!groups.has(key)) groups.set(key, { key, assignee: row.assignee || UNASSIGNED, unassigned: !row.assignee, contacts: [] });
        groups.get(key).contacts.push(row);
      }
      // Keep first-seen order, but always list unassigned contacts last.
      return [...groups.values()].sort((a, b) => a.unassigned - b.unassigned);
    }

    function sequenceFor(index) {
      return String(Math.max(1, Number(startAt.value) || 1) + index).padStart(2, "0");
    }

    function contactDisplayName(contact, index) {
      const pieces = [];
      if (groupLabel.value.trim()) pieces.push(groupLabel.value.trim());
      if (addSequence.checked) pieces.push(sequenceFor(index));
      if (keepOriginal.checked) pieces.push(contact.name || NAME_PLACEHOLDER);
      return pieces.join(" ") || contact.name || NAME_PLACEHOLDER;
    }

    function safeName(value) {
      return value.replace(/\.vcf$/i, "").replace(/[\\/:*?"<>|]/g, "-").replace(/\s+/g, " ").trim();
    }

    function baseFilename() {
      return safeName(filename.value || groupLabel.value) || "Contacts";
    }

    function fileNameFor(group) {
      return `${baseFilename()} - ${safeName(group.assignee) || UNASSIGNED}.vcf`;
    }

    function initials(name) {
      const words = name.trim().split(/\s+/).filter(Boolean);
      return (words.length > 1 ? words[0][0] + words[words.length - 1][0] : (words[0] || "?").slice(0, 2)).toUpperCase();
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    const warnIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>';
    const downloadIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>';

    const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>';

    const chevIcon = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';

    let currentGroups = [];
    // Expanded groups, by assignee key, so they stay open while editing.
    const openGroups = new Set();

    // Well-separated hues so neighbouring assignee groups are easy to tell apart.
    const GROUP_HUES = [155, 215, 280, 25, 330, 190, 45, 250];

    function markSaved(groupIndex) {
      const button = preview.querySelector(`.group-btn[data-group="${groupIndex}"]`);
      if (!button) return;
      button.classList.add("saved");
      button.innerHTML = `${checkIcon}<span class="btn-label">Saved</span>`;
    }

    function renderContact(contact, index) {
      const display = escapeHtml(contactDisplayName(contact, index));
      // Highlight the placeholder so missing names stand out in the preview.
      const name = keepOriginal.checked && !contact.name
        ? display.replace(new RegExp(`${NAME_PLACEHOLDER}$`), `<span class="na">${NAME_PLACEHOLDER}</span>`)
        : display;
      return `
        <div class="contact">
          <span class="contact-seq">${sequenceFor(index)}</span>
          <div class="contact-main">
            <span class="contact-name">${name}</span>
            <span class="contact-phone">${escapeHtml(contact.phone)}</span>
          </div>
        </div>`;
    }

    function render() {
      const { rows, skipped, lineCount } = parseRows(input.value);
      currentGroups = groupByAssignee(rows);
      const files = currentGroups.length;

      $("rowCount").textContent = plural(lineCount, "row");
      $("filePattern").textContent = baseFilename();
      $("nameExample").textContent = contactDisplayName({ name: "Jane Doe" }, 0);
      $("contactCount").textContent = files ? `${plural(rows.length, "contact")} · ${plural(files, "file")}` : "0 contacts";
      $("downloadText").textContent = files > 1 ? `Download all ${files} files` : files === 1 ? "Download file" : "Download all";
      $("downloadAllBtn").disabled = files === 0;
      message.textContent = "";

      const warnings = [];
      const missingNames = rows.filter(row => !row.name).length;
      const unassigned = rows.filter(row => !row.assignee).length;
      if (missingNames && keepOriginal.checked) warnings.push(`${plural(missingNames, "contact")} without a name will be saved as “${NAME_PLACEHOLDER}”.`);
      if (unassigned) warnings.push(`${plural(unassigned, "contact")} without an assignee went into the “${UNASSIGNED}” file.`);
      if (skipped) warnings.push(`${plural(skipped, "row")} skipped because the number column had no digits (header rows are skipped this way too).`);
      notices.innerHTML = warnings.map(text => `<div class="notice">${warnIcon}<span>${escapeHtml(text)}</span></div>`).join("");

      if (!files) {
        preview.innerHTML = '<div class="empty">Contacts will appear here, grouped by assignee.<br>Paste name, number and assignee columns to get started.</div>';
        return;
      }
      $("groupTools").hidden = files < 2;
      groupSearch.hidden = files <= 6;
      preview.innerHTML = currentGroups.map((group, groupIndex) => {
        const open = files === 1 || openGroups.has(group.key);
        return `
        <section class="group${group.unassigned ? " unassigned" : ""}${open ? " open" : ""}" data-key="${escapeHtml(group.key)}" style="--hue: ${GROUP_HUES[groupIndex % GROUP_HUES.length]}">
          <div class="group-head">
            <button class="group-toggle" type="button" aria-expanded="${open}">
              ${chevIcon}
              <span class="group-avatar">${escapeHtml(initials(group.assignee))}</span>
              <span class="group-info"><span class="group-name">${escapeHtml(group.assignee)}</span><span class="group-count">${group.contacts.length}</span></span>
            </button>
            <button class="group-btn" type="button" data-group="${groupIndex}" aria-label="Download ${escapeHtml(fileNameFor(group))}">${downloadIcon}<span class="btn-label">.vcf</span></button>
          </div>
          <div class="group-body">
            <div class="group-file">${escapeHtml(fileNameFor(group))}</div>
            <div class="contacts">${group.contacts.map(renderContact).join("")}</div>
          </div>
        </section>`;
      }).join("");
      updateToggleAll();
      applySearch();
    }

    function setOpen(section, open) {
      section.classList.toggle("open", open);
      section.querySelector(".group-toggle").setAttribute("aria-expanded", open);
      if (open) openGroups.add(section.dataset.key); else openGroups.delete(section.dataset.key);
    }

    function updateToggleAll() {
      const allOpen = currentGroups.length > 0 && currentGroups.every(group => openGroups.has(group.key));
      toggleAllBtn.textContent = allOpen ? "Collapse all" : "Expand all";
    }

    function applySearch() {
      const query = groupSearch.hidden ? "" : groupSearch.value.trim().toLowerCase();
      preview.querySelectorAll(".group").forEach(section => {
        section.hidden = Boolean(query) && !section.querySelector(".group-name").textContent.toLowerCase().includes(query);
      });
    }

    function vcardEscape(value) {
      return value.replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/;/g, "\\;").replace(/,/g, "\\,");
    }

    function buildVcf(group) {
      return group.contacts.map((contact, index) => {
        const displayName = contactDisplayName(contact, index);
        const phone = contact.phone.replace(/[\r\n]/g, "").trim();
        return [
          "BEGIN:VCARD",
          "VERSION:3.0",
          `FN:${vcardEscape(displayName)}`,
          `N:${vcardEscape(displayName)};;;;`,
          `TEL;TYPE=CELL:${vcardEscape(phone)}`,
          "END:VCARD"
        ].join("\r\n");
      }).join("\r\n") + "\r\n";
    }

    function downloadGroup(group) {
      const blob = new Blob([buildVcf(group)], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileNameFor(group);
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function downloadAll() {
      if (!currentGroups.length) return;
      const groups = currentGroups;
      const button = $("downloadAllBtn");
      button.disabled = true;
      for (let i = 0; i < groups.length; i++) {
        downloadGroup(groups[i]);
        markSaved(i);
        // Space the downloads out so browsers don't drop any of them.
        if (i < groups.length - 1) await new Promise(resolve => setTimeout(resolve, 450));
      }
      button.disabled = false;
      message.textContent = groups.length > 1
        ? `Saved ${groups.length} files. If some are missing, allow multiple downloads for this site or use the per-assignee buttons.`
        : `Saved ${fileNameFor(groups[0])}`;
    }

    preview.addEventListener("click", (event) => {
      const toggle = event.target.closest(".group-toggle");
      if (toggle) {
        const section = toggle.closest(".group");
        setOpen(section, !section.classList.contains("open"));
        updateToggleAll();
        return;
      }
      const button = event.target.closest(".group-btn");
      if (!button) return;
      const group = currentGroups[Number(button.dataset.group)];
      downloadGroup(group);
      markSaved(Number(button.dataset.group));
      message.textContent = `Saved ${fileNameFor(group)}`;
    });
    [input, groupLabel, startAt, filename, addSequence, keepOriginal].forEach(el => el.addEventListener("input", render));
    groupSearch.addEventListener("input", applySearch);
    toggleAllBtn.addEventListener("click", () => {
      const open = toggleAllBtn.textContent === "Expand all";
      preview.querySelectorAll(".group").forEach(section => setOpen(section, open));
      updateToggleAll();
    });
    $("clearBtn").addEventListener("click", () => { input.value = ""; render(); input.focus(); });
    $("downloadAllBtn").addEventListener("click", downloadAll);
    render();
  </script>
</body>
</html>
